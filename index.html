<style>
/* Layout concept: slim top bar, a dotted workbench holding the scaled board, and a 320px inspector that stacks under the board on phones. */
:root{
  --font-ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#F7F7F5; --panel:#FFFFFF; --panel2:#F3F1EA; --line:#E1DDD0; --fg:#1E1E1C; --muted:#625E54;
  --accent:#D9411A; --accent-fg:#FFFFFF; --accent-soft:#FDEFD1; --ok:#14935B; --bad:#C62828; --dots:#D6D1C0;
  --brand:#FBC43E; --brand-fg:#1E1E1C; --ink:#1E1E1C; --red:#E74920; --cream:#FDEFD1;
  --shadow:0 1px 2px rgba(30,30,28,.08),0 10px 30px rgba(30,30,28,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131311; --panel:#1C1C1A; --panel2:#252522; --line:#383834; --fg:#F7F3E8; --muted:#A8A294;
  --accent:#FBC43E; --accent-fg:#1E1E1C; --accent-soft:#3A3322; --ok:#3DD598; --bad:#FF7A6B; --dots:#2A2A27;
  --brand:#FBC43E; --brand-fg:#1E1E1C; --ink:#1E1E1C; --red:#F26A3F; --cream:#FDEFD1;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131311; --panel:#1C1C1A; --panel2:#252522; --line:#383834; --fg:#F7F3E8; --muted:#A8A294;
  --accent:#FBC43E; --accent-fg:#1E1E1C; --accent-soft:#3A3322; --ok:#3DD598; --bad:#FF7A6B; --dots:#2A2A27;
  --brand:#FBC43E; --brand-fg:#1E1E1C; --ink:#1E1E1C; --red:#F26A3F; --cream:#FDEFD1;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand img{width:30px;height:30px;border-radius:7px;display:block}
.nameinp{flex:1 1 160px;min-width:0;max-width:300px;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 10px;font-weight:600}
.nameinp:hover{border-color:var(--line)}
.nameinp:focus{background:var(--panel);border-color:var(--red);outline:none}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:auto}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-weight:600;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--brand);border-color:var(--ink);color:var(--brand-fg);box-shadow:0 2px 0 var(--ink)}
.btn.primary:hover{border-color:var(--ink);filter:brightness(1.04)}
.btn.primary:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.btn.danger{color:var(--bad)}
.btn.ic{padding:7px 9px}
.btn svg{width:16px;height:16px;flex:none}
.work{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.stagecol{min-width:0;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.bar .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-family:var(--font-mono);font-size:12px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;color:var(--muted)}
.well{background:var(--panel2);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:18px 18px;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;display:flex;justify-content:center;overflow:hidden}
#fit{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.cell{position:absolute;border:1px dashed color-mix(in srgb,currentColor 24%,transparent)}
.cell:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);cursor:copy}
.card{cursor:grab;transition:box-shadow .15s}
.card.dragging{cursor:grabbing;z-index:20;box-shadow:0 18px 40px rgba(0,0,0,.28);transition:none}
.card.sel{outline:calc(2px*var(--s,1)) solid var(--red);outline-offset:calc(2px*var(--s,1));touch-action:none;z-index:5}
.card:focus-visible{outline:calc(2px*var(--s,1)) solid var(--accent);outline-offset:calc(2px*var(--s,1))}
.h{position:absolute;display:none;width:calc(12px*var(--s,1));height:calc(12px*var(--s,1));background:var(--panel);border:calc(2px*var(--s,1)) solid var(--accent);border-radius:calc(4px*var(--s,1));touch-action:none;z-index:6}
@media (pointer:coarse){.h{width:calc(22px*var(--s,1));height:calc(22px*var(--s,1))}}
.card.sel .h{display:block}
.h-n{left:50%;top:0;transform:translate(-50%,-50%);cursor:ns-resize}
.h-s{left:50%;top:100%;transform:translate(-50%,-50%);cursor:ns-resize}
.h-e{left:100%;top:50%;transform:translate(-50%,-50%);cursor:ew-resize}
.h-w{left:0;top:50%;transform:translate(-50%,-50%);cursor:ew-resize}
.h-ne{left:100%;top:0;transform:translate(-50%,-50%);cursor:nesw-resize}
.h-nw{left:0;top:0;transform:translate(-50%,-50%);cursor:nwse-resize}
.h-se{left:100%;top:100%;transform:translate(-50%,-50%);cursor:nwse-resize}
.h-sw{left:0;top:100%;transform:translate(-50%,-50%);cursor:nesw-resize}
#ghost{position:absolute;pointer-events:none;z-index:4;border:calc(2px*var(--s,1)) dashed var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
#ghost.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
#ghost.swap{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
#prevSeg{width:auto;flex:none}#prevSeg button{padding:4px 12px}
#bTheme span{min-width:3.2em;text-align:left}
.status{margin:0;font-size:12px;color:var(--muted);font-family:var(--font-mono);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.sizebtn{font:inherit;color:var(--fg);background:var(--panel);border:1px dashed var(--muted);border-radius:6px;padding:1px 8px;cursor:pointer}
.sizebtn:hover,.sizebtn[aria-expanded="true"]{border-color:var(--accent);border-style:solid;color:var(--accent)}
.sizeed{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.sizeed label{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500}
.sizeed input[type=number]{width:96px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--fg);font-variant-numeric:tabular-nums}
.sizeed .chk2{margin-left:4px}
.insp{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 90px);overflow:auto;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
.tabs{display:flex;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);z-index:2}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:11px 8px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--brand)}
.grp{padding:14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp h3{margin:0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span,.fld>.t{font-size:12px;color:var(--muted);font-weight:500}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.fld textarea{resize:vertical}
.fld input[type=color]{width:100%;height:34px;padding:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.fld input[type=range]{width:100%;accent-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:5px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.ib{aspect-ratio:1;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:0}
.ib.on{background:var(--brand);color:var(--brand-fg);border-color:var(--ink)}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.palb{display:flex;flex-direction:column;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;font-weight:600;text-align:left}
.palb.on{border-color:var(--accent)}
.sw{display:flex;gap:2px}
.sw i{width:14px;height:14px;border-radius:4px;border:1px solid rgba(127,127,127,.3)}
.empty{padding:22px 16px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:12px;color:var(--muted);margin:0}
.thumb{width:100%;max-height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.mback{position:fixed;inset:0;background:rgba(8,10,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:50}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);box-shadow:var(--shadow);margin-top:3vh}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font-family:var(--font-display);font-size:18px}
.mbody{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.code{width:100%;min-height:300px;font-family:var(--font-mono);font-size:12px;line-height:1.5;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;white-space:pre;overflow:auto}
.pngprev{max-width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tpl{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.tpl:hover{border-color:var(--accent)}
.tpl svg{width:100%;height:auto;max-height:110px;border-radius:6px}
.tpl b{font-size:14px}
.tpl span{font-size:12px;color:var(--muted)}
.slist{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.srow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.srow small{color:var(--muted)}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
kbd{font-family:var(--font-mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.msg-bad{color:var(--bad);font-size:13px;margin:0}
@media (max-width:900px){
  .work{grid-template-columns:minmax(0,1fr)}
  .insp{position:static;max-height:none}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---- stage ---- */
function applyScale(){
  const g=geom(doc),well=$('#well'),aw=Math.max(120,well.clientWidth-24);
  let s=aw/g.W;
  if(window.innerWidth>900)s=Math.min(s,Math.max(360,window.innerHeight-230)/g.H);
  scale=Math.min(s,1);
  const fit=$('#fit'),st=$('#stage');
  fit.style.width=px(g.W*scale);fit.style.height=px(g.H*scale);
  st.style.width=g.W+'px';st.style.height=g.H+'px';
  st.style.transform='scale('+scale+')';st.style.setProperty('--s',String(1/scale));
}
function renderStage(){
  const g=geom(doc),st=$('#stage');
  applyScale();
  const view=previewNight?nightDoc(doc):doc;
  st.style.background=view.bg;st.style.fontFamily=FONTS[doc.font].css;st.style.color=autoText(view.bg);
  let h='';
  if(guides){
    const occ=new Set();doc.cards.forEach(c=>{for(let yy=c.y;yy<c.y+c.h;yy++)for(let xx=c.x;xx<c.x+c.w;xx++)occ.add(xx+','+yy);});
    for(let y=0;y<doc.rows;y++)for(let x=0;x<doc.cols;x++){
      if(occ.has(x+','+y))continue;
      h+='<div class="cell" data-x="'+x+'" data-y="'+y+'" style="left:'+px(doc.pad+x*(g.cw+doc.gap))+';top:'+px(doc.pad+y*(g.ch+doc.gap))+';width:'+px(g.cw)+';height:'+px(g.ch)+';border-radius:'+px(Math.min(doc.radius,18))+'"></div>';
    }
  }
  h+=view.cards.map(c=>toHTML(cardNode(c,view,g,px,'stage',IMGS[c.img]||''),false)).join('');
  h+='<div id="ghost" hidden></div>';
  st.innerHTML=h;
  const e=sel&&$('.card[data-id="'+sel+'"]',st);if(e)e.classList.add('sel');
}
function setSel(id){
  sel=id;
  $$('#stage .card').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));
  if(id)tab='card';
  renderInspector();
}
const stagePoint=e=>{const r=$('#stage').getBoundingClientRect();return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};};
function showGhost(c,cls){
  const gh=$('#ghost');if(!gh)return;const r=rect(doc,geom(doc),c);
  gh.hidden=false;gh.className=cls||'';
  gh.style.left=px(r.x);gh.style.top=px(r.y);gh.style.width=px(r.w);gh.style.height=px(r.h);
}
function initStage(){
  const st=$('#stage');
  st.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    const cEl=e.target.closest('.card'),hEl=e.target.closest('.h');
    if(!cEl){
      const cell=e.target.closest('.cell');
      if(cell){addCard(1,1,{x:+cell.dataset.x,y:+cell.dataset.y});}else setSel(null);
      return;
    }
    const id=cEl.dataset.id,was=sel===id;
    if(!was)setSel(id);
    if(e.pointerType!=='mouse'&&!was)return;
    const c=card(id),p=stagePoint(e);
    const el=$('.card[data-id="'+id+'"]',st);
    drag={mode:hEl?'resize':'move',h:hEl?hEl.dataset.h:'',id,sx:p.x,sy:p.y,orig:{x:c.x,y:c.y,w:c.w,h:c.h},best:null,moved:false,el};
    try{st.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  st.addEventListener('pointermove',e=>{
    if(!drag)return;
    const p=stagePoint(e),dx=p.x-drag.sx,dy=p.y-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)<4)return;
    drag.moved=true;
    const g=geom(doc),dcx=Math.round(dx/(g.cw+doc.gap)),dcy=Math.round(dy/(g.ch+doc.gap)),o=drag.orig;
    if(drag.mode==='move'){
      const cand={x:clamp(o.x+dcx,0,doc.cols-o.w),y:clamp(o.y+dcy,0,doc.rows-o.h),w:o.w,h:o.h};
      const pl=placement(doc,drag.id,cand,o);
      drag.best=pl.ok?{cand,pl}:null;
      showGhost(cand,pl.ok?(pl.swap?'swap':''):'bad');
      drag.el.classList.add('dragging');
      drag.el.style.transform='translate('+px(dx)+','+px(dy)+')';
    }else{
      let l=o.x,t=o.y,r=o.x+o.w,b=o.y+o.h;const h=drag.h;
      if(h.includes('e'))r=clamp(r+dcx,l+1,doc.cols);
      if(h.includes('w'))l=clamp(l+dcx,0,r-1);
      if(h.includes('s'))b=clamp(b+dcy,t+1,doc.rows);
      if(h.includes('n'))t=clamp(t+dcy,0,b-1);
      const cand={x:l,y:t,w:r-l,h:b-t};
      const ok=placement(doc,drag.id,cand,o);
      if(ok.ok&&!ok.swap)drag.best={cand,pl:ok};
      const use=drag.best?drag.best.cand:o,rr=rect(doc,g,use);
      drag.el.style.left=px(rr.x);drag.el.style.top=px(rr.y);drag.el.style.width=px(rr.w);drag.el.style.height=px(rr.h);
      showGhost(use,'');
    }
  });
  const end=e=>{
    if(!drag)return;
    const d=drag;drag=null;
    try{st.releasePointerCapture(e.pointerId);}catch(err){}
    if(d.moved){
      if(d.best&&e.type!=='pointercancel'){
        const {cand,pl}=d.best;
        mutate(doc2=>{
          const c=doc2.cards.find(z=>z.id===d.id);Object.assign(c,{x:cand.x,y:cand.y,w:cand.w,h:cand.h});
          if(pl.swap){const o=doc2.cards.find(z=>z.id===pl.swap);o.x=pl.to.x;o.y=pl.to.y;}
        });
      }else if(d.mode==='move'&&e.type!=='pointercancel')toast('That spot is taken.');
      renderStage();renderInspector();
    }
  };
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  st.addEventListener('dblclick',e=>{
    /* pointer capture retargets the event to the stage, so find the card under the pointer */
    const ce=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('card'));
    if(!ce)return;const c=card(ce.dataset.id);if(c&&c.role==='day'){sel=c.id;pickImage();}
  });
  st.addEventListener('focusin',e=>{const c=e.target.closest&&e.target.closest('.card');if(c&&sel!==c.dataset.id)setSel(c.dataset.id);});
}

/* ---- card actions ---- */
function palColor(){
  const p=PALETTES.find(x=>x.id===doc.palette)||PALETTES[0];
  return p.cards[doc.cards.length%p.cards.length];
}
function addCard(w,h,at){
  const spot=at&&!doc.cards.some(o=>!isBase(o)&&hit({x:at.x,y:at.y,w,h},o))&&inb(doc,{x:at.x,y:at.y,w,h})?at:findSpot(doc,w,h);
  if(!spot){toast('No room for a '+w+'×'+h+' card. Add a row or column, or resize a card.');return;}
  const col=palColor();let id=null;
  mutate(d=>{const c=newCard({x:spot.x,y:spot.y,w,h,c1:col[0],c2:col[1],title:'New card',body:w*h>=2?'Write something here.':''});id=c.id;d.cards.push(c);});
  sel=id;tab='card';renderStage();renderInspector();
  const t=$('#f-title');if(t&&window.innerWidth>900){t.focus();t.select();}
}
function dupSel(){
  const c=sel&&card(sel);if(!c)return;
  const spot=findSpot(doc,c.w,c.h);if(!spot){toast('No free space for a copy.');return;}
  let id=null;
  mutate(d=>{const n=newCard(JSON.parse(JSON.stringify(c)));n.id=uid();n.role='';n.date='';n.x=spot.x;n.y=spot.y;id=n.id;d.cards.push(n);});
  sel=id;renderStage();renderInspector();
}
function delSel(){
  if(!sel)return;
  const id=sel;sel=null;
  mutate(d=>{d.cards=d.cards.filter(c=>c.id!==id);});
  renderInspector();toast('Card deleted. Press Ctrl+Z to bring it back.');
}
function nudge(dx,dy){
  const c=card(sel);if(!c)return;
  const cand={x:c.x+dx,y:c.y+dy,w:c.w,h:c.h},pl=placement(doc,c.id,cand,{x:c.x,y:c.y});
  if(!pl.ok)return;
  mutate(d=>{const k=d.cards.find(z=>z.id===c.id);k.x=cand.x;k.y=cand.y;if(pl.swap){const o=d.cards.find(z=>z.id===pl.swap);o.x=pl.to.x;o.y=pl.to.y;}});
  renderInspector();
}
function resizeBy(dw,dh){
  const c=card(sel);if(!c)return;
  const cand={x:c.x,y:c.y,w:c.w+dw,h:c.h+dh},pl=placement(doc,c.id,cand,c);
  if(!pl.ok||pl.swap)return;
  mutate(d=>{const k=d.cards.find(z=>z.id===c.id);k.w=cand.w;k.h=cand.h;});
  renderInspector();
}

  '<section class="grp"><h3>Board</h3><div class="row"><button type="button" class="btn" data-act="pack">Pack cards upward</button><button type="button" class="btn danger" data-act="clear" id="clearBtn">Clear all cards</button></div></section>';

function renderInspector(){

function setProp(k,v,key){

}
let clearArm=0,customRatio=false;
function initInspector(){
  const box=$('#insp');
  box.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.k&&t.type!=='checkbox'){
      let v=t.value;if(t.type==='range')v=Number(v);
      setProp(t.dataset.k,v);
      if(t.type==='range'){const lab=t.closest('.fld').querySelector('span');if(lab){const n=lab.textContent.replace(/\s*\(.*$/,'');const k=t.dataset.k;
        lab.textContent=n+' ('+(k==='size'||k==='shade'?Math.round(v*100)+'%':k==='angle'?Math.round(v)+'°':k==='bw'?v+'px':v)+')';}}
    }else if(t.dataset.d&&(t.type==='range'||t.type==='color')){
      const k=t.dataset.d,v=t.type==='range'?Number(t.value):t.value;
      mutate(d=>{d[k]=v;},'d:'+k);
      if(t.type==='range'){const lab=t.closest('.fld').querySelector('span');lab.textContent=lab.textContent.replace(/\(.*\)/,'('+Math.round(v)+')');}
    }else if(t.dataset.caldim){
      const v=Number(t.value);
      mutate(d=>{d.cal.dim=v;d.cards.forEach(c=>{if(c.role==='day')c.shade=v;});},'caldim');
      t.closest('.fld').querySelector('span').textContent='Photo dimming ('+Math.round(v*100)+'%)';
    }
  });
  box.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.calv){if(!doc.cal)return;const v=t.value;if(v===(doc.cal.variant||'classic'))return;mutate(d=>regenCal(d,d.cal.y,d.cal.m,{variant:v}));sel=null;renderAll();return;}
    if(t.dataset.cal){if(!doc.cal)return;let y=doc.cal.y,m=doc.cal.m;if(t.dataset.cal==='m')m=Number(t.value);else y=Math.round(Number(t.value)||y);setCalMonth(y,m);return;}
    if(t.dataset.k==='tcauto'){
      const c=card(sel);if(!c)return;
      setProp('tc',t.checked?'auto':textColor(c,doc),'tc:'+sel);renderInspector();return;
    }
    if(t.dataset.k==='vertical'){setProp('vertical',t.checked);return;}
    if(t.dataset.pos){
      const c=card(sel);if(!c)return;
      const n=Math.round(Number(t.value));const k=t.dataset.pos;
      const cand={x:c.x,y:c.y,w:c.w,h:c.h};
      if(k==='x')cand.x=n-1;else if(k==='y')cand.y=n-1;else cand[k]=n;
      const pl=placement(doc,c.id,cand,c);
      if(pl.ok&&!pl.swap)mutate(d=>{Object.assign(d.cards.find(z=>z.id===c.id),cand);});else toast('That position is taken or outside the grid.');
      renderInspector();return;
    }
    if(t.dataset.d){
      const k=t.dataset.d;
      if(k==='ratio'){
        if(t.value!=='custom'){customRatio=false;const r=RATIOS.find(z=>z[0]===t.value);mutate(d=>{d.rw=r[1];d.rh=r[2];});}
        else customRatio=true;
        renderInspector();return;
      }
      if(k==='cols'||k==='rows'){
        const n=Math.round(clamp(Number(t.value)||1,1,24));
        const need=doc.cards.reduce((m,c)=>Math.max(m,k==='cols'?c.x+c.w:c.y+c.h),1);
        if(n<need){toast('Move or shrink cards first. The farthest card ends at '+(k==='cols'?'column ':'row ')+need+'.');renderInspector();return;}
        mutate(d=>{d[k]=n;});renderInspector();return;
      }
      if(k==='rw'||k==='rh'){mutate(d=>{d[k]=clamp(Number(t.value)||1,1,10000);});renderInspector();return;}
      if(k==='font'){mutate(d=>{d.font=t.value;});return;}
    }
    if(t.type==='file'){uploadImage(t.files&&t.files[0]);t.value='';}
  });
  box.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.calact){calAction(b.dataset.calact,b);return;}
    if(b.dataset.calseg){const v=b.dataset.v;mutate(d=>{d.cal.numColor=v;});renderInspector();return;}
    if(b.dataset.tab){tab=b.dataset.tab;renderInspector();return;}
    if(b.dataset.seg){
      const k=b.dataset.seg,v=b.dataset.v;
      mutate(d=>{const c=d.cards.find(z=>z.id===sel);if(!c)return;c[k]=v;if(k==='fill'&&v==='outline'&&c.bw===0)c.bw=2;});
      renderInspector();return;
    }
    if(b.dataset.icon){const c=card(sel);setProp('icon',c&&c.icon===b.dataset.icon?'':b.dataset.icon);renderInspector();return;}
    if(b.dataset.pal){const p=PALETTES.find(z=>z.id===b.dataset.pal);mutate(d=>applyPalette(d,p));renderInspector();return;}
    switch(b.dataset.act){
      case 'dup':dupSel();break;
      case 'del':delSel();break;
      case 'addone':addCard(1,1);break;
      case 'upload':case 'daypic':pickImage();break;
      case 'rmimg':mutate(d=>{const c=d.cards.find(z=>z.id===sel);if(c){c.img='';c.fill=c.role==='day'?emptyFill(d):'gradient';}});renderInspector();break;
      case 'pack':mutate(d=>packUp(d));toast('Cards packed upward.');break;
      case 'clear':
        if(Date.now()-clearArm<3000){mutate(d=>{d.cards=[];});sel=null;renderInspector();clearArm=0;}
        else{clearArm=Date.now();b.textContent='Click again to clear';setTimeout(()=>{if(b.isConnected)b.textContent='Clear all cards';},3000);}
        break;
    }
  });
}
/* ---- image upload (resized, stored as data URI) ---- */
function pickImage(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/png,image/jpeg,image/webp,image/gif';
  inp.addEventListener('change',()=>uploadImage(inp.files&&inp.files[0]));inp.click();
}
function readImage(file,max,q,jpeg){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('open'));
      im.onload=()=>{
        const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(im.naturalWidth*k));cv.height=Math.max(1,Math.round(im.naturalHeight*k));
        const x=cv.getContext('2d');
        const png=!jpeg&&(file.type==='image/png'||file.type==='image/gif');
        if(!png){x.fillStyle='#FFFFFF';x.fillRect(0,0,cv.width,cv.height);}
        x.drawImage(im,0,0,cv.width,cv.height);
        res({key:'i'+uid().slice(1),url:cv.toDataURL(png?'image/png':'image/jpeg',q||0.86)});
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const IMG_OK=/^image\/(png|jpeg|webp|gif)$/;
function uploadImage(file){
  if(!file||!sel)return;
  if(!IMG_OK.test(file.type)){toast('Use a PNG, JPEG, WebP or GIF image.');return;}
  const id=sel,c0=card(id),day=!!(c0&&c0.role==='day');
  readImage(file,day?640:1400,day?0.8:0.86,day).then(r=>{
    IMGS[r.key]=r.url;
    mutate(d=>{const c=d.cards.find(z=>z.id===id);if(c){c.img=r.key;c.fill='image';if(day&&d.cal)c.shade=d.cal.dim;}});
    renderInspector();toast('Photo added.');
  }).catch(()=>toast('Could not open that image.'));
}
/* ---- calendar actions ---- */
function setCalMonth(y,m){
  y=clamp(y,1970,2100);
  if(y===doc.cal.y&&m===doc.cal.m){renderInspector();return;}
  mutate(d=>regenCal(d,y,m));
  sel=null;renderAll();
}
function calAction(a,btn){
  const cal=doc.cal;if(!cal)return;
  if(a==='prev'){let y=cal.y,m=cal.m-1;if(m<0){m=11;y--;}setCalMonth(y,m);}
  else if(a==='next'){let y=cal.y,m=cal.m+1;if(m>11){m=0;y++;}setCalMonth(y,m);}
  else if(a==='today'){const n=new Date();setCalMonth(n.getFullYear(),n.getMonth());}
  else if(a==='cover'){const h=doc.cards.find(k=>k.role==='hero');if(h){sel=h.id;pickImage();}}
  else if(a==='many')pickMany(false);
  else if(a==='same')pickMany(true);
  else if(a==='clearph'){
    if(Date.now()-clearArm<3000){mutate(d=>{d.cards.forEach(c=>{if(c.role==='day'&&c.img){c.img='';c.fill=emptyFill(d);}});d.cal.photos={};});clearArm=0;renderInspector();toast('Photos removed. Press Ctrl+Z to bring them back.');}
    else{clearArm=Date.now();btn.textContent='Click again to remove all';setTimeout(()=>{if(btn.isConnected)btn.textContent='Remove all photos';},3000);}
  }
}
function pickMany(same){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/png,image/jpeg,image/webp,image/gif';inp.multiple=!same;
  inp.addEventListener('change',()=>addPhotos(Array.from(inp.files||[]),same));inp.click();
}
async function addPhotos(files,same){
  files=files.filter(f=>IMG_OK.test(f.type));
  if(!files.length){toast('Choose PNG, JPEG, WebP or GIF images.');return;}
  const days=doc.cards.filter(c=>c.role==='day'&&!c.img).sort((a,b)=>a.date<b.date?-1:1);
  if(!days.length){toast('Every day already has a photo.');return;}
  const use=same?[files[0]]:files.slice(0,days.length);
  toast('Adding '+(same?'the photo':use.length+(use.length>1?' photos':' photo'))+'…');
  const out=[];
  for(const f of use){try{out.push(await readImage(f,640,0.8,true));}catch(e){out.push(null);}}
  const ok=out.filter(Boolean);
  if(!ok.length){toast('Could not open those images.');return;}
  ok.forEach(r=>{IMGS[r.key]=r.url;});
  const ids=days.map(c=>c.id);
  mutate(d=>{ids.forEach((id,i)=>{
    const r=same?ok[0]:out[i];if(!r)return;
    const c=d.cards.find(z=>z.id===id);if(c){c.img=r.key;c.fill='image';c.shade=d.cal.dim;}
  });});
  renderInspector();
  toast(same?'Photo added to '+days.length+' days.':'Added '+ok.length+(ok.length>1?' photos':' photo')+(files.length>days.length?'. '+(files.length-days.length)+' did not fit.':'.'));
}
/* ================= PNG renderer ================= */
const imgCache={};
function loadImg(src){
  if(!src)return Promise.resolve(null);
  if(imgCache[src])return imgCache[src];
  return imgCache[src]=new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});
}
function rr(x,X,Y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));x.beginPath();
  x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();
}
function gradFor(x,r,c){
  const rad=(c.angle-90)*Math.PI/180,dx=Math.cos(rad),dy=Math.sin(rad);
  const L=(Math.abs(r.w*Math.cos(rad))+Math.abs(r.h*Math.sin(rad)))/2,cx=r.x+r.w/2,cy=r.y+r.h/2;
  const g=x.createLinearGradient(cx-dx*L,cy-dy*L,cx+dx*L,cy+dy*L);g.addColorStop(0,c.c1);g.addColorStop(1,c.c2);return g;
}
function wrapText(x,text,maxW){
  const out=[];
  String(text).split('\n').forEach(par=>{
    const words=par.split(/\s+/).filter(Boolean);let line='';
    if(!words.length){out.push('');return;}
    words.forEach(w=>{const t=line?line+' '+w:w;if(line&&x.measureText(t).width>maxW){out.push(line);line=w;}else line=t;});
    out.push(line);
  });
  return out;
}
function drawIcon(x,name,X,Y,size,col){
  x.save();x.translate(X,Y);x.scale(size/24,size/24);x.lineWidth=2;x.lineCap='round';x.lineJoin='round';x.strokeStyle=col;x.stroke(new Path2D(ICONS[name]));x.restore();
}
function stampPath(x,r){
  const R=stampR(r),n=Math.max(2,Math.round(r.w/(R*2.6))),nv=Math.max(2,Math.round(r.h/(R*2.6))),S=r.w/n,Sv=r.h/nv,x0=r.x,y0=r.y,x1=r.x+r.w,y1=r.y+r.h,P=Math.PI;
  x.beginPath();x.moveTo(x0,y0);
  for(let i=0;i<n;i++){const cx=x0+(i+0.5)*S;x.lineTo(cx-R,y0);x.arc(cx,y0,R,P,0,true);}
  x.lineTo(x1,y0);
  for(let i=0;i<nv;i++){const cy=y0+(i+0.5)*Sv;x.lineTo(x1,cy-R);x.arc(x1,cy,R,-P/2,P/2,true);}
  x.lineTo(x1,y1);
  for(let i=n-1;i>=0;i--){const cx=x0+(i+0.5)*S;x.lineTo(cx+R,y1);x.arc(cx,y1,R,0,P,true);}
  x.lineTo(x0,y1);
  for(let i=nv-1;i>=0;i--){const cy=y0+(i+0.5)*Sv;x.lineTo(x0,cy+R);x.arc(x0,cy,R,P/2,-P/2,true);}
  x.closePath();
}
function shapePath(x,c,r,d){if(c.shape==='stamp')stampPath(x,r);else rr(x,r.x,r.y,r.w,r.h,c.shape==='circle'?r.w/2:d.radius);}
function drawContent(x,c,fw,fh,col,fam,m){
  const pad=m.pad,maxW=Math.max(10,fw-2*pad),blocks=[];
  if(c.icon&&ICONS[c.icon])blocks.push({t:'icon',h:m.icon,w:m.icon});
  if(c.stat){x.font='800 '+m.stat+'px '+fam;blocks.push({t:'stat',h:m.stat,lines:[c.stat],lh:m.stat});}
  if(c.title){x.font=(c.fw>0?c.fw:700)+' '+m.fs+'px '+fam;const l=wrapText(x,c.title,maxW);blocks.push({t:'title',h:l.length*m.fs*1.1,lines:l,lh:m.fs*1.1});}
  if(c.body){x.font='400 '+m.body+'px '+fam;const l=wrapText(x,c.body,maxW);blocks.push({t:'body',h:l.length*m.body*1.4,lines:l,lh:m.body*1.4});}
  if(c.link||c.linkLabel){
    x.font='600 '+m.body+'px '+fam;const label=c.linkLabel||c.link;
    const w=Math.min(maxW,x.measureText(label).width+m.body*0.4+m.body+m.body*1.7+3);
    blocks.push({t:'pill',h:m.body*1.25+m.body*0.9+3,w,label});
  }
  if(!blocks.length)return;
  const total=blocks.reduce((s,b)=>s+b.h,0)+m.gap*(blocks.length-1);
  let y=c.va==='top'?pad:c.va==='center'?(fh-total)/2:fh-pad-total;
  const ax=c.ha==='left'?pad:c.ha==='center'?fw/2:fw-pad;
  const left=w=>c.ha==='left'?pad:c.ha==='center'?fw/2-w/2:fw-pad-w;
  x.fillStyle=col;x.textAlign=c.ha;x.textBaseline='middle';
  blocks.forEach(b=>{
    if(b.t==='icon')drawIcon(x,c.icon,left(b.w),y,b.w,col);
    else if(b.t==='pill'){
      const X=left(b.w);x.save();x.lineWidth=1.5;x.strokeStyle=col;rr(x,X+.75,y+.75,b.w-1.5,b.h-1.5,b.h);x.stroke();
      x.font='600 '+m.body+'px '+fam;x.fillStyle=col;x.textAlign='left';
      x.fillText(b.label,X+m.body*0.85+1.5,y+b.h/2,Math.max(10,b.w-m.body*2.9));
      drawIcon(x,'arrow',X+b.w-m.body*0.85-1.5-m.body,y+b.h/2-m.body/2,m.body,col);x.restore();
    }else{
      x.save();
      x.font=(b.t==='stat'?'800 '+m.stat:b.t==='title'?(c.fw>0?c.fw:700)+' '+m.fs:'400 '+m.body)+'px '+fam;
      if(b.t==='body')x.globalAlpha=0.8;
      b.lines.forEach((ln,i)=>x.fillText(ln,ax,y+i*b.lh+b.lh/2));
      x.restore();
    }
    y+=b.h+m.gap;
  });
}
async function drawCard(x,c,g,d){
  const r=shapeRect(c,rect(d,g,c)),m=metrics(c,r),col=textColor(c,d),fam=FONTS[d.font].css;
  if(c.shape==='ring'){
    x.save();x.fillStyle=c.c1;x.fillRect(r.x,r.y+r.h/2,r.w,r.h/2);
    const rg=ringGeom(r);
    for(let i=0;i<rg.n;i++){
      const px0=r.x+i*rg.pitch+(rg.pitch-rg.pw)/2,py0=r.y+(r.h-rg.ph)/2;
      x.fillStyle=c.c2;rr(x,px0,py0,rg.pw,rg.ph,rg.pw/2);x.fill();
      x.save();rr(x,px0,py0,rg.pw,rg.ph,rg.pw/2);x.clip();x.fillStyle='rgba(255,255,255,0.22)';x.fillRect(px0,py0,rg.pw*0.2,rg.ph);x.restore();
    }
    x.restore();return;
  }
  const cc=c.title&&showTitle(c,d)!==c.title?Object.assign({},c,{title:''}):c;
  x.save();shapePath(x,c,r,d);
  if(c.fill==='solid'){x.fillStyle=c.c1;x.fill();}
  else if(c.fill==='gradient'){x.fillStyle=gradFor(x,r,c);x.fill();}
  else if(c.fill==='image'){
    const im=await loadImg(IMGS[c.img]);
    if(im){
      x.clip();const k=Math.max(r.w/im.naturalWidth,r.h/im.naturalHeight),dw=im.naturalWidth*k,dh=im.naturalHeight*k;
      x.drawImage(im,r.x+(r.w-dw)/2,r.y+(r.h-dh)/2,dw,dh);x.fillStyle='rgba(0,0,0,'+c.shade+')';x.fillRect(r.x,r.y,r.w,r.h);
    }else{x.fillStyle=gradFor(x,r,c);x.fill();}
  }
  x.restore();
  x.save();shapePath(x,c,r,d);x.clip();
  if(c.vertical){x.translate(r.x+r.w/2,r.y+r.h/2);x.rotate(Math.PI/2);x.translate(-r.h/2,-r.w/2);drawContent(x,cc,r.h,r.w,col,fam,m);}
  else{x.translate(r.x,r.y);drawContent(x,cc,r.w,r.h,col,fam,m);}
  x.restore();
  if(c.bw>0&&c.shape!=='stamp'){
    x.save();rr(x,r.x+c.bw/2,r.y+c.bw/2,r.w-c.bw,r.h-c.bw,(c.shape==='circle'?r.w/2:d.radius)-c.bw/2);x.lineWidth=c.bw;x.strokeStyle=c.bc==='auto'?col:c.bc;x.stroke();x.restore();
  }
}
async function renderPNG(k,night){
  const d=night?nightDoc(doc):doc;
  const fam=FONTS[d.font].css;
  try{await Promise.all([500,600,700,800].map(w=>document.fonts.load(w+' 20px '+fam)));}catch(e){}
  const g=geom(d),cv=document.createElement('canvas');
  const px=pxSize(d);cv.width=px.w;cv.height=px.h;
  const x=cv.getContext('2d');x.scale(px.w/g.W,px.h/g.H);x.fillStyle=d.bg;x.fillRect(0,0,g.W,g.H);
  for(const c of d.cards)await drawCard(x,c,g,d);
  return new Promise(res=>cv.toBlob(res,'image/png'));
}

function b64e(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(str){const s=atob(str.replace(/-/g,'+').replace(/_/g,'/'));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
async function makeShareCode(){
  const raw=new TextEncoder().encode(JSON.stringify({app:'log365',v:1,doc,images:usedImages(doc,IMGS)}));
  if(typeof CompressionStream==='undefined')return 'bf0.'+b64e(raw);
  const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(raw);w.close();
  return 'bf1.'+b64e(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
}
async function parseShare(text){
  text=text.trim();let json;
  if(text.startsWith('bf1.')){
    const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(b64d(text.slice(4)));w.close();
    json=new TextDecoder().decode(new Uint8Array(await new Response(ds.readable).arrayBuffer()));
  }else if(text.startsWith('bf0.'))json=new TextDecoder().decode(b64d(text.slice(4)));
  else json=text;
  const obj=JSON.parse(json);
  return sanitizeDoc(obj.doc||obj,obj.images||{});
}

/* ================= modals ================= */
function openModal(title,html,onMount){
  const m=$('#modal');modalOpen=true;
  m.innerHTML='<div class="mbox" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="mhead"><h2>'+esc(title)+'</h2><button type="button" class="btn ic" id="mClose" aria-label="Close">✕</button></div><div class="mbody">'+html+'</div></div>';
  m.hidden=false;
  $('#mClose').onclick=closeModal;
  m.onclick=e=>{if(e.target===m)closeModal();};
  if(onMount)onMount($('.mbody',m));
  const f=$('#mClose');if(f)f.focus();
}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';modalOpen=false;}
async function saveFile(name,data){
  if(!DL){toast('Saving files is not available in this view. Use Copy instead.');return;}
  try{await DL.save({filename:name,data});toast('Saved '+name);}
  catch(err){if(err&&err.code==='declined')return;toast('Could not save the file.');}
}
async function copyFrom(ta,btn){
  try{await navigator.clipboard.writeText(ta.value);const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>{btn.textContent=o;},1400);}
  catch(e){ta.focus();ta.select();toast('Press Ctrl+C to copy the selected text.');}
}
function codeBlock(text,note){
  return '<textarea class="code" id="codeArea" readonly spellcheck="false" aria-label="Code">'+esc(text)+'</textarea><p class="hint">'+note+'</p>';
}
let pngUrl='',pngNight=false,exNight=true;
function openExport(kind){
  const tabs=[['png','PNG image'],['html','HTML + CSS'],['react','React'],['json','JSON']];
  openModal('Export','<div class="seg" id="exTabs">'+tabs.map(t=>'<button type="button" data-ex="'+t[0]+'">'+t[1]+'</button>').join('')+'</div><div id="exBody"></div>',body=>{
    body.querySelector('#exTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)showExport(b.dataset.ex);});
    showExport(kind||'png');
  });
}
async function showExport(kind){
  $$('#exTabs button').forEach(b=>b.classList.toggle('on',b.dataset.ex===kind));
  const box=$('#exBody');if(!box)return;
  const base=slug(doc.name);
  if(kind==='png'){
    box.innerHTML='<p class="hint">Rendering…</p>';
    let blob=null;
    try{blob=await renderPNG(1,pngNight);}catch(e){blob=null;}
    if(!blob){if($('#exBody'))$('#exBody').innerHTML='<p class="msg-bad">Could not render the image in this browser.</p>';return;}
    if(!$('#exBody')||!$('#exTabs button.on')||$('#exTabs button.on').dataset.ex!=='png')return;
    const du=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result||''));f.onerror=()=>r('');f.readAsDataURL(blob);});
    if(!$('#exBody')||!$('#exTabs button.on')||$('#exTabs button.on').dataset.ex!=='png')return;
    if(pngUrl&&pngUrl.slice(0,5)==='blob:')URL.revokeObjectURL(pngUrl);
    pngUrl=du||URL.createObjectURL(blob);const g=geom(doc);
    box.innerHTML='<div class="row"><span class="hint">Look</span><div class="seg" id="pngMode" style="width:auto;flex:none"><button type="button" data-pm="day" class="'+(pngNight?'':'on')+'">Day</button><button type="button" data-pm="night" class="'+(pngNight?'on':'')+'">Night</button></div></div><img class="pngprev" alt="Rendered board" src="'+pngUrl+'"><div class="row"><button type="button" class="btn primary" id="savePng"'+(DL?'':' disabled')+'>Save PNG</button><span class="hint">'+pxSize(doc).w+' × '+pxSize(doc).h+' px'+(DL?'':'. Saving is not available in this view; press and hold or right-click the image instead.')+'</span></div>';
    $('#savePng').onclick=()=>saveFile(base+(pngNight?'-night':'')+'.png',blob);
    $('#pngMode').onclick=e=>{const b=e.target.closest('button');if(b){pngNight=b.dataset.pm==='night';showExport('png');}};
    return;
  }
  let text,note,fname;
  if(kind==='html'){text=exportHTML(doc,IMGS,{night:exNight});fname=base+'.html';note='A complete page. Sizes use container query units, so the board scales with its width. Photos are embedded.';}
  else if(kind==='react'){text=exportJSX(doc,{night:exNight});fname=pascal(doc.name)+'.jsx.txt';note='A single component with inline styles. Rename the file to .jsx. Photos become path placeholders.';}
  else{text=exportJSON(doc,IMGS);fname=base+'.json';note='The full layout. Import it again from Share &amp; import.';}
  box.innerHTML=(kind==='json'?'':'<label class="row"><input type="checkbox" id="exNight"'+(exNight?' checked':'')+'> Include a day/night toggle that starts from the visitor\'s system setting</label>')+codeBlock(text,note)+'<div class="row"><button type="button" class="btn primary" id="cpy">Copy</button><button type="button" class="btn" id="sav"'+(DL?'':' disabled')+'>Save file</button><span class="hint">'+(text.length/1024).toFixed(1)+' KB</span></div>';
  const nb=$('#exNight');if(nb)nb.onchange=()=>{exNight=nb.checked;showExport(kind);};
  $('#cpy').onclick=e=>copyFrom($('#codeArea'),e.currentTarget);
  $('#sav').onclick=()=>saveFile(fname,text);
}
async function openShare(){
  openModal('Share & import','<div class="fld"><span class="t">Share code. Send it to anyone; they paste it under Import.</span><textarea class="code" id="shareArea" style="min-height:110px;white-space:pre-wrap;word-break:break-all" readonly>Preparing…</textarea></div><div class="row"><button type="button" class="btn primary" id="cpyShare">Copy code</button><span class="hint" id="shareSize"></span></div>'+
    '<div class="fld"><span class="t">Import a share code or a layout JSON file</span><textarea class="code" id="impArea" style="min-height:110px;white-space:pre-wrap;word-break:break-all" placeholder="Paste here"></textarea></div><p class="msg-bad" id="impErr" hidden></p><div class="row"><button type="button" class="btn" id="impBtn">Import and replace the board</button><span class="hint">You can undo an import.</span></div>',async()=>{
      $('#cpyShare').onclick=e=>copyFrom($('#shareArea'),e.currentTarget);
      $('#impBtn').onclick=async()=>{
        const err=$('#impErr');err.hidden=true;
        try{const r=await parseShare($('#impArea').value);if(!r.doc.cards.length&&$('#impArea').value.trim().length<20)throw new Error('Nothing to import.');closeModal();loadDoc(r.doc,r.imgs,'Imported "'+r.doc.name+'".');}
        catch(e){err.textContent='Could not read that. '+(e&&e.message?e.message:'');err.hidden=false;}
      };
      try{const code=await makeShareCode();if($('#shareArea')){$('#shareArea').value=code;$('#shareSize').textContent=(code.length/1024).toFixed(1)+' KB';}}
      catch(e){if($('#shareArea'))$('#shareArea').value='Could not build a code.';}
    });
}
function miniPreview(t){
  const d=buildTemplate(t),g=geom(d);
  return '<svg viewBox="0 0 '+g.W+' '+g.H+'" aria-hidden="true"><rect width="'+g.W+'" height="'+g.H+'" fill="'+d.bg+'"/>'+d.cards.map(c=>{const r=shapeRect(c,rect(d,g,c));if(c.fill==='outline'){if(c.bw>0)return '<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" fill="none" stroke="'+(c.bc==='auto'?autoText(d.bg):c.bc)+'" stroke-opacity="0.6" stroke-width="3"/>';return '';}if(c.shape==='circle')return '<circle cx="'+(r.x+r.w/2)+'" cy="'+(r.y+r.h/2)+'" r="'+r.w/2+'" fill="'+c.c1+'"/>';if(c.shape==='ring'){const rg=ringGeom(r);let o='<rect x="'+r.x+'" y="'+(r.y+r.h/2)+'" width="'+r.w+'" height="'+r.h/2+'" fill="'+c.c1+'"/>';for(let i=0;i<rg.n;i++)o+='<rect x="'+(r.x+i*rg.pitch+(rg.pitch-rg.pw)/2)+'" y="'+(r.y+(r.h-rg.ph)/2)+'" width="'+rg.pw+'" height="'+rg.ph+'" rx="'+rg.pw/2+'" fill="'+c.c2+'"/>';return o;}return '<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" rx="'+d.radius+'" fill="'+c.c1+'"/>';}).join('')+'</svg>';
}
function openLayouts(which){
  const saved=()=>{try{return JSON.parse(lsGet('log365:saved')||'[]');}catch(e){return [];}};
  openModal('Layouts','<div class="seg" id="lyTabs"><button type="button" data-ly="tpl">Templates</button><button type="button" data-ly="saved">Saved on this device</button></div><div id="lyBody"></div>',body=>{
    const show=w=>{
      $$('#lyTabs button').forEach(b=>b.classList.toggle('on',b.dataset.ly===w));
      const box=$('#lyBody');
      if(w==='tpl'){
        box.innerHTML='<div class="tgrid">'+TEMPLATES.map(t=>'<button type="button" class="tpl" data-tpl="'+t.id+'">'+miniPreview(t)+'<b>'+esc(t.name)+'</b><span>'+esc(t.desc)+'</span></button>').join('')+'</div><p class="hint">Applying a template replaces the board. You can undo it.</p>';
      }else{
        const list=saved();
        box.innerHTML='<div class="row"><input type="text" id="svName" class="nameinp" style="border-color:var(--line);background:var(--panel2);max-width:260px" placeholder="Name this layout" maxlength="60" value="'+esc(doc.name)+'"><button type="button" class="btn primary" id="svBtn">Save current board</button></div>'+
          (list.length?'<div class="slist">'+list.map(s=>'<div class="srow"><span class="n">'+esc(s.name)+'</span><small>'+new Date(s.ts).toLocaleDateString()+'</small><button type="button" class="btn" data-load="'+s.id+'">Load</button><button type="button" class="btn danger" data-rm="'+s.id+'">Delete</button></div>').join('')+'</div>':'<p class="hint">Nothing saved yet. Layouts are kept in this browser only; use Share &amp; import to move one elsewhere.</p>');
      }
    };
    body.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.ly)show(b.dataset.ly);
      else if(b.dataset.tpl){const t=TEMPLATES.find(z=>z.id===b.dataset.tpl);closeModal();loadDoc(buildTemplate(t),{},t.cal?'Calendar ready. Select a day to choose its photo.':'Loaded "'+t.name+'".');}
      else if(b.id==='svBtn'){
        const name=($('#svName').value||'Untitled board').slice(0,60),list=saved();
        list.unshift({id:uid(),name,ts:Date.now(),data:{doc,images:usedImages(doc,IMGS)}});
        if(lsSet('log365:saved',JSON.stringify(list.slice(0,30)))){toast('Saved "'+name+'".');show('saved');}else toast('Could not save. Browser storage is full or blocked.');
      }else if(b.dataset.load){
        const s=saved().find(z=>z.id===b.dataset.load);if(!s)return;
        try{const r=sanitizeDoc(s.data.doc,s.data.images);closeModal();loadDoc(r.doc,r.imgs,'Loaded "'+s.name+'".');}catch(err){toast('That layout could not be opened.');}
      }else if(b.dataset.rm){lsSet('log365:saved',JSON.stringify(saved().filter(z=>z.id!==b.dataset.rm)));show('saved');}
    });
    show(which||'tpl');
  });
}
function openHelp(){
  const rows=[['Click / Tab','Select a card'],['Drag','Move (swaps with a same-fit neighbour)'],['Drag handles','Resize to any span'],['Double-click a day','Choose its photo (calendar)'],['Arrow keys','Move selected card'],['Shift + arrows','Resize selected card'],['Ctrl/⌘ + Z','Undo'],['Ctrl/⌘ + Shift + Z','Redo'],['Ctrl/⌘ + D','Duplicate'],['Delete','Delete selected card'],['N','Add a 1×1 card'],['G','Toggle cell guides'],['Esc','Deselect'],['?','This list']];
  openModal('Keyboard shortcuts','<div class="kbd">'+rows.map(r=>'<kbd>'+esc(r[0])+'</kbd><span>'+esc(r[1])+'</span>').join('')+'</div>');
}

/* ================= boot ================= */
function boot(){
  initStage();initInspector();initSize();
  $('#boardName').addEventListener('input',e=>{mutate(d=>{d.name=e.target.value.slice(0,60)||'Untitled board';},'name');});
  $('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
  $('#bLayouts').onclick=()=>openLayouts();$('#bShare').onclick=openShare;$('#bExport').onclick=()=>openExport();$('#bHelp').onclick=openHelp;
  $('#bTheme').onclick=toggleTheme;
  $('#prevSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setPreview(b.dataset.pv==='night');});
  $('#guides').addEventListener('change',e=>{guides=e.target.checked;renderStage();});
  document.addEventListener('keydown',e=>{
    if(modalOpen){if(e.key==='Escape')closeModal();return;}
    const t=e.target,typing=t&&t.matches&&t.matches('input,textarea,select');
    if(typing){if(e.key==='Escape')t.blur();return;}
    const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
    if(mod&&k==='z'){e.preventDefault();if(e.shiftKey)redo();else undo();return;}
    if(mod&&k==='y'){e.preventDefault();redo();return;}
    if(mod&&k==='d'){e.preventDefault();dupSel();return;}
    if(mod)return;
    if(e.key==='?'){openHelp();return;}
    if(k==='n'){addCard(1,1);return;}
    if(k==='g'){guides=!guides;$('#guides').checked=guides;renderStage();return;}
    if(!sel)return;
    if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delSel();return;}
    if(e.key==='Escape'){setSel(null);return;}
    const A={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
    if(A){e.preventDefault();if(e.shiftKey)resizeBy(A[0],A[1]);else nudge(A[0],A[1]);}
  });
  if(typeof ResizeObserver!=='undefined'){let ro=0;new ResizeObserver(()=>{cancelAnimationFrame(ro);ro=requestAnimationFrame(()=>{if(doc)applyScale();});}).observe($('#well'));}
  window.addEventListener('resize',()=>{if(doc)applyScale();});
  const th=lsGet('log365:theme');theme=th==='night'||th==='dark'?'night':th==='day'||th==='light'?'day':null;paintTheme();
  try{const mq=window.matchMedia('(prefers-color-scheme: dark)');(mq.addEventListener?mq.addEventListener.bind(mq,'change'):function(){})(()=>{if(!theme)paintTheme();});}catch(e){}
  let start=null;
  try{const raw=lsGet('log365:current');if(raw){const o=JSON.parse(raw);const r=sanitizeDoc(o.doc,o.images);if(r.doc.cards.length||o.doc&&o.doc.cards&&!o.doc.cards.length){start=r;}}}catch(e){start=null;}
  if(start){doc=start.doc;Object.assign(IMGS,start.imgs);}
  else doc=buildTemplate(TEMPLATES[0]);
  if(doc.cal)tab='calendar';
  renderAll();
  try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d||null;}).catch(()=>{DL=null;});}catch(e){DL=null;}
}
boot();
</script>
